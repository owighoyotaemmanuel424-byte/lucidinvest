name: Security patch and production build

on:
  push:
    branches: [main]
    paths-ignore:
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lucidinvest-main-security-build
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Regenerate lockfile for patched dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Commit synchronized lockfile
        if: success()
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh lockfile for patched Next.js"
            git push origin HEAD:main
          else
            echo "Lockfile already synchronized."
          fi
